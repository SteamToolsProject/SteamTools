[workspace]
resolver = "2"
members = [
    "crates/stt-core",
    "crates/stt-platform",
    "crates/stt-config",
]
default-members = [
    "crates/stt-core",
    "crates/stt-platform",
    "crates/stt-config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "local"
publish = false

[workspace.dependencies]
stt-core = { path = "crates/stt-core" }
stt-platform = { path = "crates/stt-platform" }
stt-config = { path = "crates/stt-config" }
