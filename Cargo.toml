[workspace]
resolver = "2"
members = [
    "crates/stt-core",
    "crates/stt-catalog",
    "crates/stt-platform",
    "crates/stt-config",
    "crates/stt-metadata",
    "crates/stt-hook",
    "crates/stt-steamui",
    "crates/stt-steamclient",
    "crates/stt-store-accel",
    "crates/stt-host",
    "crates/stt-loader-dwmapi",
    "crates/stt-loader-xinput",
]
default-members = [
    "crates/stt-core",
    "crates/stt-catalog",
    "crates/stt-platform",
    "crates/stt-config",
    "crates/stt-metadata",
    "crates/stt-hook",
    "crates/stt-steamui",
    "crates/stt-steamclient",
    "crates/stt-host",
    "crates/stt-store-accel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/SteamToolsProject/SteamTools"
publish = false

[workspace.dependencies]
stt-core = { path = "crates/stt-core" }
stt-catalog = { path = "crates/stt-catalog" }
stt-platform = { path = "crates/stt-platform" }
stt-config = { path = "crates/stt-config" }
stt-metadata = { path = "crates/stt-metadata" }
stt-hook = { path = "crates/stt-hook" }
stt-steamui = { path = "crates/stt-steamui" }
stt-steamclient = { path = "crates/stt-steamclient", default-features = false }
stt-store-accel = { path = "crates/stt-store-accel" }

[workspace.lints.rust]
nonstandard_style = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -2 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
