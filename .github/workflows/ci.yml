name: CI

on:
  # 所有人(除 owner)合入 master 走 PR, PR 跑完整检查;
  # owner 直接 push master 也触发完整检查做反馈.
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  # sccache 共享编译缓存: 各 job 并行编译时互不重复.
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: 2G
  RUSTC_WRAPPER: sccache

# 同一 PR/分支的新 push 取消仍在跑的旧 run, 避免多次重复构建.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 按变更内容决定哪些 job 需要跑: 只改文档/README 时跳过全部编译.
  changes:
    runs-on: windows-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            ui:
              - 'crates/stt-steamui/ui/**'
              - '.github/workflows/ci.yml'

  fmt:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla/sccache-action@v0.0.11
        with:
          sccache-version: 0.17.0
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla/sccache-action@v0.0.11
        with:
          sccache-version: 0.17.0
      - name: Test (workspace, all features, serial)
        run: cargo test --workspace --all-features --no-fail-fast -- --test-threads=1

  release:
    # 完整检查的一部分: 事件只会是 master 的 push 或 PR, 有 Rust 变更就验证产物.
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla/sccache-action@v0.0.11
        with:
          sccache-version: 0.17.0
      - name: Release build (product artifacts)
        run: cargo build -p stt-host -p stt-store-accel -p stt-loader-dwmapi -p stt-loader-xinput --release

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/stt-steamui/ui/package-lock.json
      - name: Config panel UI check
        working-directory: crates/stt-steamui/ui
        run: |
          npm ci
          npm run check
