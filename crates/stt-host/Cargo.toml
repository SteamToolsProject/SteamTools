[package]
name = "stt-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SteamTools host cdylib (stbase.dll)"

[lib]
# Product DLL filename on disk.
crate-type = ["cdylib", "rlib"]
name = "stbase"

[features]
default = [
    "download-manifest",
    "download-key",
    "download-token",
    "download-request-code",
]
download-manifest = ["stt-steamclient/download-manifest"]
download-key = ["stt-steamclient/download-key"]
download-token = ["stt-steamclient/download-token"]
download-request-code = ["stt-steamclient/download-request-code", "dep:serde_json"]

[dependencies]
stt-core = { workspace = true }
stt-catalog = { workspace = true }
stt-platform = { workspace = true }
stt-config = { workspace = true }
stt-metadata = { workspace = true }
stt-hook = { workspace = true }
stt-steamui = { workspace = true }
stt-steamclient = { workspace = true }
stt-store-accel = { workspace = true }
stt-update = { workspace = true }
serde_json = { version = "1", optional = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
